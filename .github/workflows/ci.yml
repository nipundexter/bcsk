name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Unit tests
    runs-on: ubuntu-latest
    env:
      # QUAL-2: the backend refuses to boot without a JWT_SECRET (SEC-1, by design), so its
      # build and tests need one. A throwaway CI value, not a real secret.
      JWT_SECRET: ci-placeholder-secret-at-least-32-chars-long
      # Prisma only needs a parseable URL to generate the client; nothing here connects.
      # These belong to the backend alone — the web app has no database credentials at all.
      DATABASE_URL: postgresql://user:pass@localhost:5432/bcsk
      DIRECT_URL: postgresql://user:pass@localhost:5432/bcsk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # CI never installs the root manifest (it only proxies npm scripts locally, via
          # concurrently/cross-env for `npm run dev` — neither is used here), so the cache
          # key names just the two lockfiles CI actually restores from.
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Two independent projects — each installs and runs on its own; CI never runs the
      # root's proxy scripts.
      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Generate Prisma client
        run: npm --prefix backend exec -- prisma generate

      - name: Typecheck
        run: |
          npm --prefix backend run typecheck
          npm --prefix frontend run typecheck

      # Backend has no eslint.config.js, so only the web app is linted.
      - name: Lint
        run: npm --prefix frontend run lint

      - name: Unit tests
        run: |
          npm --prefix backend run test
          npm --prefix frontend run test

      - name: Build
        run: |
          npm --prefix backend run build
          npm --prefix frontend run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # The admission funnel writes real rows, so it needs a real database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bcsk
          POSTGRES_PASSWORD: bcsk
          POSTGRES_DB: bcsk
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      JWT_SECRET: ci-placeholder-secret-at-least-32-chars-long
      DATABASE_URL: postgresql://bcsk:bcsk@localhost:5432/bcsk
      DIRECT_URL: postgresql://bcsk:bcsk@localhost:5432/bcsk
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      ALLOW_DEMO_PASSWORD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # No root lockfile any more, so the cache key must name both projects'
          # lockfiles explicitly or setup-node fails looking for one at the root.
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Apply schema and seed
        run: |
          npm --prefix backend run db:migrate
          npm --prefix backend run db:seed

      - name: Install Playwright browser
        run: npm --prefix frontend exec -- playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm --prefix frontend run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
